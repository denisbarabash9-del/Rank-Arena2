
name: Build Rank Arena2 IPA

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: macos-latest

    steps:
      - name: Download project
        uses: actions/checkout@v4

      - name: Build iOS application
        run: |
          xcodebuild \
            -project RankArena.xcodeproj \
            -scheme RankArena \
            -configuration Release \
            -sdk iphoneos \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            build

      - name: Create unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/RankArena.app Payload/
          zip -r RankArena.ipa Payload

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: RankArena2-iPhone
          path: RankArena.ipa
